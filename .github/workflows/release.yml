name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  BUN_VERSION: 1.4

# Needed to create the GitHub Release and upload artifacts.
permissions:
  contents: write

jobs:
  build:
    name: Build for Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.Bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, test
        run: |
          bun run lint
          bun run typecheck
          bun run test

      # --publish never: the softprops step below owns release creation and
      # artifact upload; electron-builder must only build into dist/.
      - name: Build and package
        run: bun run package:release

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
